# Build, test and deploy the site to GitHub Pages.
# Runs on every push to main, when the monthly refresh dispatches it, and by hand. Fails safe: if the tests, the
# build or the browser self-test fail, nothing is deployed and the last good version stays live.
name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The public base URL. Set the repository variable SITE_URL to move the site to a custom domain.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SS_GOATCOUNTER: ${{ vars.SS_GOATCOUNTER }}     # optional: https://<code>.goatcounter.com/count
  SS_SUPPORT_URL: ${{ vars.SS_SUPPORT_URL }}     # optional: donation / sponsor page
  SS_BOOKSHOP_ID: ${{ vars.SS_BOOKSHOP_ID }}     # optional: affiliate id, only off GitHub Pages (see OPERATIONS.md)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit, data and build tests
        run: npm test
      - name: Build the site
        run: node scripts/build.mjs
      - name: End-to-end self-test in Chrome (import, picks, tracker, sharing, phone layout, nothing sent anywhere)
        run: node scripts/selftest.mjs
      - name: List pages that changed since the live deploy
        run: node scripts/indexnow.mjs --diff "$SITE_URL/manifest.json" dist/manifest.json > changed-urls.txt
      - name: Keep the self-test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ github.run_number }}
          path: selftest-out
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: changed-urls
          path: changed-urls.txt
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-again:
    # Pages sometimes stalls while syncing files; offer the same build a second time before giving up.
    needs: [build, deploy]
    if: failure() && needs.build.result == 'success' && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: sleep 60
      - id: deployment
        uses: actions/deploy-pages@v5

  after-deploy:
    needs: [deploy, deploy-again]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-again.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: changed-urls
      - name: Smoke-test the live site
        run: |
          sleep 30
          node scripts/linkcheck.mjs "$SITE_URL" --sample 40
      - name: Tell search engines about changed pages (IndexNow)
        run: node scripts/indexnow.mjs --file changed-urls.txt || true
